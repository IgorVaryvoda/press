[package]
name = "press"
version = "0.4.1"
edition = "2024"
authors = ["Igor Varyvoda <igor@varyvoda.com>"]
description = "Audit and optimise images locally, with optional Sirv and Studio actions"

[[bin]]
name = "press"
path = "src/main.rs"

# One dependency for the whole UI stack: gpui-kit re-exports the matching
# gpui, platform, component and asset crates together. Cargo.lock pins the
# actual versions; CI builds --locked.
[dependencies]
gpui-kit = "0.6"
# The icon SVGs `IconName` refers to. Without an asset source registered on the
# application every icon resolves to nothing and renders as empty space.
futures = "0.3"
image = { version = "0.25", features = ["avif-native"] }
jixel = "0.2.19"
jxl-oxide = { version = "0.12.6", features = ["image"] }
walkdir = "2"
libwebp-sys = "0.14.4"
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake"] }
# Sirv REST sync. ureq keeps the dependency tree pure Rust (rustls), so no new
# system packages join the CI images; calls run on gpui's background executor.
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.27.0"
cargo-packager-updater = { version = "0.2.3", optional = true }

[features]
updater = ["dep:cargo-packager-updater"]

# rfd's portal backend keeps GTK out of the build on Linux; it does not exist
# on the other platforms, where rfd's defaults are already the native dialogs.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.17.2"

# Atomic settings replacement calls ReplaceFileW/MoveFileExW directly; the std
# rename will not replace an existing file on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

# gpui can render a frame to an image and hand back the pixels, but only with
# `test-support` on. That is how `cargo test --bin press -- --ignored
# screenshot` gets a picture of the real window without needing the screen.
[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }
# The screenshot harness feeds HeadlessAppContext a real headless renderer,
# which gpui-pre-platform gates behind its own test-support; the facade does
# not forward that feature.
gpui-pre-platform = { version = "0.3.1", features = ["test-support"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
vcpkg = "0.2"

[package.metadata.packager]
before-packaging-command = "cargo build --release --locked --features updater"
product-name = "Press"
# Deliberately still the old identifier. macOS binds Full Disk and folder access
# grants to it, and the Windows installer treats a new identifier as a different
# product rather than an upgrade. It is invisible to users; the name they read is
# product-name. Change it only in a release that accepts a clean reinstall.
identifier = "dev.imageguide.desktop"
description = "Audit and optimise images locally, with optional Sirv and Studio actions"
long-description = "Press audits folders of images and converts them locally to WebP, AVIF, or JPEG XL."
homepage = "https://imageguide.dev"
license-file = "LICENSE"
category = "Graphics and Design"
icons = ["assets/app-icon.png"]
resources = [
    { src = "target/visioncpp-runtime/bin", target = "visioncpp/bin" },
    { src = "target/visioncpp-runtime/lib", target = "visioncpp/lib" },
    { src = "target/visioncpp-runtime/LICENSE", target = "visioncpp/LICENSE" },
]

[package.metadata.packager.deb]
package-name = "press"
section = "graphics"
priority = "optional"
depends = [
    "libavif16 (>= 1.0.4)",
    "libc6 (>= 2.39)",
    "libdav1d7 (>= 0.1.0)",
    "libgcc-s1 (>= 4.2)",
    "libxcb1 (>= 1.12)",
    "libxkbcommon-x11-0 (>= 0.5.0)",
    "libxkbcommon0 (>= 0.5.0)",
]
files = { "LICENSE" = "/usr/share/doc/press/copyright" }

[package.metadata.packager.pacman]
depends = [
    "dav1d",
    "glibc",
    "hicolor-icon-theme",
    "libavif",
    "libgcc",
    "libxcb",
    "libxkbcommon",
    "libxkbcommon-x11",
]
files = { "LICENSE" = "/usr/share/licenses/press/LICENSE" }

[package.metadata.packager.macos]
# The env var override did not take, so the real identity lives here. Ad-hoc
# local packaging can still pass `--signing-identity -` on the command line.
signing-identity = "Developer ID Application: Igor Varyvoda (2Z5ZVRKA23)"
info-plist-path = "assets/macos/Info.plist"

[profile.release]
opt-level = 3
