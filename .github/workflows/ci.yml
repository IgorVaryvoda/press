name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
          cache: false
      - name: Validate workflows
        run: scripts/check-workflows.sh

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # libavif uses libaom to encode and libyuv where the package provides it.
      # The rest is what gpui needs to link a window on Linux.
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdav1d-dev libavif-dev libaom-dev libyuv-dev \
            cmake clang pkg-config \
            libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
            libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libxcb1-dev

      - name: System dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libavif

      - name: System dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pkgconfiglite -y --no-progress
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libavif[aom,dav1d]:x64-windows-static"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV
          "DAV1D_STATIC=1" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\lib\pkgconfig" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: clippy, rustfmt

      # gpui is a git dependency and a large one. Caching it turns a cold ten-minute
      # build into about a minute.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The steps below run with `--features updater`, so this is the only compile of
      # the default feature set and the only one that sees the
      # `#[cfg(not(feature = "updater"))]` arm. A release link of gpui costs about ten
      # minutes per platform, which a pull request does not need, so a pull request
      # gets the same feature set through a `cargo check` and the push to main keeps
      # the release build that guards a tag.
      - name: Build
        if: github.event_name != 'pull_request'
        run: cargo build --release --locked

      - name: Check the default feature set
        if: github.event_name == 'pull_request'
        run: cargo check --locked

      - name: Test
        run: cargo test --locked --features updater

      - name: Clippy
        run: cargo clippy --all-targets --features updater -- -D warnings

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
